<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>ISRAEL | Sign Up</title>
</head>

<body>

    <section class="signin-section">

        <!-- LEFT PANEL -->
        <div class="signin-left">

            <div class="signin-logo">
                <span class="logo-text">Israel</span>
            </div>

            <div class="signin-form-wrapper">

                <div class="signin-title-wrapper">
                    <h2 class="signin-title">Create Account</h2>
                    <p class="signin-subtitle">Join Israel today. It's completely free!</p>
                </div>

                <div class="signin-fields">

                    <div class="field-wrapper">
                        <label class="field-label" for="fullName">Full Name</label>
                        <input type="text" class="signin-input" id="fullName" />
                    </div>

                    <div class="field-wrapper">
                        <label class="field-label" for="username">Username</label>
                        <input type="text" class="signin-input" id="username" />
                    </div>

                    <div class="field-wrapper">
                        <label class="field-label" for="emailAddress">Email Address</label>
                        <input type="text" class="signin-input" id="emailAddress" />
                    </div>

                    <div class="field-wrapper">
                        <label class="field-label" for="password">Password</label>
                        <input type="password" class="signin-input" id="password" />
                    </div>

                    <div class="terms-wrapper">
                        <input type="checkbox" id="agreeTerms" class="terms-checkbox" />
                        <div class="custom-checkbox"></div>
                        <label for="agreeTerms" class="terms-label">
                            I agree to the
                            <a class="terms-link">Terms</a> and
                            <a class="terms-link">Privacy Policy</a>.
                        </label>
                    </div>

                    <div class="signin-btn-group">


                        <button class="btn btn2" title="Create Account">Create Account</button>
                    </div>

                </div>

                <p class="signup-footer">
                    Already have an account? <a href="index.html" class="signup-footer-link">Sign In!</a>
                </p>

            </div>

        </div>

        <div class="play-button-wrapper">
            <div class="play-button">
                <div class="play-icon"></div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="signin-right">
            <img src="all-images/background_img.jpeg" alt="Decorative background" class="signin-bg-img" />
        </div>

    </section>

</body>

</html>

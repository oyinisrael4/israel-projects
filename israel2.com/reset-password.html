<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>ISRAEL | Reset Password</title>
</head>

<body>

    <section class="signin-section">

        <!-- LEFT PANEL -->
        <div class="signin-left">

            <div class="signin-logo">
                <span class="logo-text">Israel</span>
            </div>

            <div class="signin-form-wrapper">

                <div class="signin-title-wrapper">
                    <h2 class="signin-title">Reset Password</h2>
                </div>

                <div class="rp-alert-success">
                    <span class="rp-alert-highlight">Israel</span>, an OTP has been sent to your
                    <span class="rp-alert-highlight">email address</span> to reset your password.
                </div>

                <div class="signin-fields">

                    <div class="field-wrapper">
                        <label class="field-label" for="otp">OTP Code</label>
                        <input type="number" class="signin-input" id="otp" />
                    </div>

                    <div class="field-wrapper">
                        <label class="field-label" for="newPassword">New Password</label>
                        <input type="password" class="signin-input" id="newPassword" />
                    </div>

                    <div class="rp-alert-warning">
                        <span class="text">At least 8 characters required including upper &amp; lower cases and special
                            characters and
                            numbers.</span>
                    </div>

                    <div class="field-wrapper">
                        <label class="field-label" for="confirmedPassword">Confirm Password</label>
                        <input type="password" class="signin-input" id="confirmedPassword" />
                    </div>

                    <div class="signin-btn-group">


                        <button class="btn btn2" title="Submit">Submit</button>
                    </div>

                </div>

                <p class="signup-footer">
                    Return to <a href="index.html" class="signup-footer-link">Log In</a>
                </p>

            </div>
        </div>

        <div class="play-button-wrapper">
            <div class="play-button">
                <div class="play-icon"></div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="signin-right">
            <img src="all-images/background_img.jpeg" alt="Decorative background" class="signin-bg-img" />
        </div>

    </section>

</body>

</html>

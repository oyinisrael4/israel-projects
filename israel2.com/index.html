<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>ISRAEL | Sign In</title>
</head>

<body>

    <section class="signin-section">

        <!-- LEFT PANEL -->
        <div class="signin-left">

            <div class="signin-logo">
                <span class="logo-text">Israel</span>
            </div>

            <div class="signin-form-wrapper">

                <div class="signin-title-wrapper">
                    <h2 class="signin-title">Welcome Back!</h2>
                    <p class="signin-subtitle">Please Log in to your account.</p>
                </div>

                <div class="signin-fields">

                    <div class="field-wrapper">
                        <label class="field-label" for="emailUsername">Email Address</label>
                        <input type="text" class="signin-input" id="emailUsername" />
                    </div>

                    <div class="field-wrapper">
                        <label class="field-label" for="signinPassword">Password</label>
                        <input type="password" class="signin-input" id="signinPassword" />
                    </div>

                    <div class="remember-forgot-wrapper">
                        <div class="remember-wrapper">
                            <input type="checkbox" id="rememberMe" class="remember-checkbox" />
                            <div class="custom-checkbox"></div>
                            <label for="rememberMe" class="remember-label">Remember me</label>
                        </div>
                        <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
                    </div>

                    <div class="signin-btn-group">
                        <button class="btn" title="Login">Login</button>
                        <a href="sign-up.html">
                            <button class="btn create-account-btn" title="Create account">Create account</button>
                        </a>
                    </div>

                </div>

            </div>

            <div class="signin-footer-wrapper" style="text-align: center;">
                <p class="copyright-text">By sign up you agree to our term and that you have read our<br />data policy
                </p>
            </div>

        </div>

        <div class="play-button-wrapper">
            <div class="play-button">
                <div class="play-icon"></div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="signin-right">
            <img src="all-images/background_img.jpeg" alt="Decorative background" class="signin-bg-img" />
        </div>

    </section>

</body>

</html>

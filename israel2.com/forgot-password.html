<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>ISRAEL | Forgot Password</title>
</head>

<body>

    <section class="signin-section">

        <!-- LEFT PANEL -->
        <div class="signin-left">

            <div class="signin-logo">
                <span class="logo-text">Israel</span>
            </div>

            <div class="signin-form-wrapper">

                <div class="signin-title-wrapper">
                    <h2 class="signin-title">Forgot password?</h2>
                    <p class="signin-subtitle fp">
                        Enter the email address or mobile number
                        associated with your account.
                    </p>
                </div>

                <div class="signin-fields">

                    <div class="field-wrapper">
                        <label class="field-label" for="emailMobile">Email or Mobile Number</label>
                        <input type="text" class="signin-input" id="emailMobile" />
                    </div>

                    <div class="signin-btn-group">

                        <a href="reset-password.html" class="create-account-link" style="display: block; width: 100%;">
                            <button class="btn btn2" title="Continue">Continue</button>
                        </a>

                    </div>

                </div>

                <p class="signup-footer">
                    Return to <a href="index.html" class="signup-footer-link">Log In</a>
                </p>

            </div>

        </div>

        <div class="play-button-wrapper">
            <div class="play-button">
                <div class="play-icon"></div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="signin-right">
            <img src="all-images/background_img.jpeg" alt="Decorative background" class="signin-bg-img" />
        </div>

    </section>

</body>

</html>

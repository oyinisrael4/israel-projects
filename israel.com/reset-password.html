<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>ISRAEL | Reset Password</title>
</head>

<body>

    <section class="signin-section">

        <!-- LEFT PANEL -->
        <div class="signin-left">

            <div class="signin-form-wrapper">

                <div class="signin-logo">
                    <span class="logo-text">Israel</span>
                </div>

                <div class="rp-alert-success">
                    &#128075; <span class="rp-alert-highlight">Israel</span>, an OTP has been sent to your
                    <span class="rp-alert-highlight">email address</span> to reset your password.
                </div>

                <div class="signin-fields">

                    <div class="field-wrapper">
                        <input type="number" class="signin-input" id="otp" placeholder="OTP" />
                    </div>

                    <div class="field-wrapper">
                        <input type="password" class="signin-input" id="newPassword" placeholder="New Password" />
                    </div>

                    <div class="rp-alert-warning">
                        <i>At least 8 characters required including upper &amp; lower cases and special characters and
                            numbers.</i>
                    </div>

                    <div class="field-wrapper">
                        <input type="password" class="signin-input" id="confirmedPassword"
                            placeholder="Confirm Password" />
                    </div>

                    <button class="signin-btn" title="Submit">SUBMIT</button>

                </div>

                <p class="fp-footer">
                    Return to <a href="index.html" class="fp-footer-link">Log In</a>
                </p>


            </div>

            <div class="signin-footer-wrapper">
                <p class="copyright-text">Copyright © 2024 <span class="brand-name">Israel</span>. All Rights Reserved.
                </p>

            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="signin-right">
            <img src="all-images/background_img.jpeg" alt="Person working on laptop in a cafe" class="signin-bg-img" />
        </div>

    </section>

</body>

</html>

<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>ISRAEL | Sign Up</title>
</head>

<body>

    <section class="signin-section">

        <!-- LEFT PANEL -->
        <div class="signin-left">

            <div class="signin-form-wrapper">

                <div class="signin-logo">
                    <span class="logo-text">Israel</span>
                </div>

                <div class="signin-fields">

                    <div class="field-wrapper">
                        <input type="text" class="signin-input" id="fullName" placeholder="Full Name" />
                    </div>

                    <div class="field-wrapper">
                        <input type="text" class="signin-input" id="username" placeholder="Username" />
                    </div>

                    <div class="field-wrapper">
                        <input type="text" class="signin-input" id="emailAddress" placeholder="Email Address" />
                    </div>

                    <div class="field-wrapper">
                        <input type="password" class="signin-input" id="password" placeholder="Password" />
                    </div>

                    <div class="terms-wrapper">
                        <input type="checkbox" id="agreeTerms" class="terms-checkbox" />
                        <label for="agreeTerms" class="terms-label">
                            I agree to the
                            <a class="terms-link">Terms</a> and
                            <a class="terms-link">Privacy Policy</a>.
                        </label>
                    </div>

                    <button class="signin-btn" title="Create Account">CREATE ACCOUNT</button>

                </div>

                <p class="signup-footer">
                    Already have an account? <a href="index.html" class="signup-footer-link">Sign In!</a>
                </p>

            </div>

             <div class="signin-footer-wrapper">
                <p class="copyright-text">Copyright © 2024 <span class="brand-name">Israel</span>. All Rights Reserved.
                </p>

            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="signin-right">
            <img src="all-images/background_img.jpeg" alt="Person working on laptop in a cafe" class="signin-bg-img" />
        </div>

    </section>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/constants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="all-images/icon-images/icon.png" />
    <title>NIIT - Reset Password</title>
</head>

<body>

    <!-- Alert Modal Container (from reference webtesting.com) -->
    <div class="alert-overlay" id="alert"></div>

    <div class="login-page-wrapper">
        <div class="login-card">

            <div class="login-form-panel">
                <div class="login-form-inner">

                    <div class="login-logo-wrapper">
                        <img src="all-images/icon-images/niit-logo.png" alt="NIIT" />
                    </div>

                    <div class="login-heading-wrapper">
                        <h1>Reset Password</h1>
                        <p>Already have an account? <a href="login.html">Sign In</a></p>
                    </div>

                    <form class="login-form" id="resetPasswordForm">
                        <div class="login-input-wrapper">
                            <label for="otp">OTP</label>
                            <input type="text" id="otp" placeholder="Enter your OTP" />
                        </div>

                        <div class="login-input-wrapper">
                            <label for="newPassword">New Password</label>
                            <input type="password" id="newPassword" placeholder="Enter your new password" />
                        </div>

                        <div class="login-input-wrapper">
                            <label for="confirmPassword">Confirm Password</label>
                            <input type="password" id="confirmPassword" placeholder="Confirm your password" />
                        </div>

                        <button type="submit" id="submitBtnId" class="btn login-submit-btn">Submit</button>
                    </form>

                    <div class="login-social-row">
                        <span>Or Sign Up with</span>
                        <div class="login-social-wrapper">
                            <button type="button" class="login-social-btn login-social-btn-facebook"
                                title="Login with Facebook">
                                <i class="bi bi-facebook"></i>
                            </button>
                            <button type="button" class="login-social-btn login-social-btn-twitter"
                                title="Login with Twitter">
                                <i class="bi bi-twitter"></i>
                            </button>
                        </div>
                    </div>

                </div>
            </div>

            <div class="login-hero-panel">
                <div class="login-hero-shape"></div>
                <div class="login-hero-content">
                    <h2>Almost<br>There.</h2>
                    <p>Enter the OTP sent to your phone number and your new password to reset your password.</p>
                </div>
            </div>

        </div>
    </div>

    <script src="JS/api.js"></script>
    <script src="JS/auth.js"></script>
</body>

</html>

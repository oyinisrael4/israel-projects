<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>

    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />

    <meta property="og:type" content="Website" />

    <link href="all-images/icon-images/icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />

    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>My First Web Project</title>

<body>

    <div class="landing-page-bg">
        <div class="overlay-bg">

            <div class="theme-settings-btn">
                <i class="bi bi-gear-fill"></i>
            </div>

            <header>
                <div class="header-wrapper">
                    <div class="logo-wrapper">
                        <img src="/all-images/icon-images/logo.png" alt="Logo">
                    </div>
                    <nav>
                        <ul>
                            <li class="active"><span>Home</span></li>
                            <li>Company</li>
                            <li>Services</li>
                            <li>Project</li>
                            <li>Elements</li>
                            <li>Shop</li>
                            <li>Blog</li>
                            <li>Contact</li>
                            <li>Shop</li>
                        </ul>
                    </nav>

                    <div class="header-contact-container">
                        <div class="contact">
                            <i class="bi bi-telephone-fill"></i>
                            <span>+2349021947874</span>
                        </div>
                        <button class="btn"><i class="bi bi-grid-3x3-gap-fill"></i></button>
                    </div>

                </div>

            </header>

            <div class="hero-wrapper">

                    <span class="hero-line"></span>
                    <h1>Set Apart Your Interior Design</h1>
                    <p>Luxury Interior Designing lorem ipsum dolor sit amet consectetur adipisicing
                        elit sed eiusmod tempor incididunt labore dolore magna aliqua.</p>

                    <div class="hero-btn-container">
                        <button class="btn hero-btn-filled">Who We Are</button>
                        <button class="btn hero-btn-outline">Works We Did</button>
                    </div>
                </div>
            </div>

            <button class="slider-arrow slider-arrow-left">
                <i class="bi bi-chevron-left"></i>
            </button>
            <button class="slider-arrow slider-arrow-right">
                <i class="bi bi-chevron-right"></i>
            </button>

            <div class="side-icon-bar">
                <div class="side-icon side-icon-1"><i class="bi bi-pencil-square"></i></div>
                <div class="side-icon side-icon-2"><i class="bi bi-display"></i></div>
                <div class="side-icon side-icon-3"><i class="bi bi-chat-dots-fill"></i></div>
                <div class="side-icon side-icon-4"><i class="bi bi-bag-fill"></i></div>
            </div>

        </div>

    </div>
